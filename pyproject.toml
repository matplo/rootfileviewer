[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootfileviewer"
version = "0.8.0"
description = "Terminal viewer for ROOT, Parquet, and HDF5 files — ASCII tree, branch/column tables, and an interactive TUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "matplo" },
]
keywords = ["root", "uproot", "parquet", "pyarrow", "hdf5", "h5py", "cern", "physics", "terminal", "tui", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "uproot>=5.0",
    "rich>=13.0",
    "textual>=0.50",
    "plotext>=5.0",
    "textual-plotext>=1.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
hdf5 = ["h5py>=3.0"]
all = ["rootfileviewer[parquet,hdf5]"]

[project.urls]
Homepage = "https://github.com/matplo/rootfileviewer"
Issues = "https://github.com/matplo/rootfileviewer/issues"

[project.scripts]
rootfileviewer = "rootfileviewer.cli:main"
rfv = "rootfileviewer.cli:main"
rfvt = "rootfileviewer.cli:main_tui"

[tool.hatch.build.targets.wheel]
packages = ["src/rootfileviewer"]
